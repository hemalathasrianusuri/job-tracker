name: Backend CI

on:
  push:
    branches: [main]
    paths: ["apps/api/**", ".github/workflows/ci-backend.yml"]
  pull_request:
    paths: ["apps/api/**", ".github/workflows/ci-backend.yml"]

defaults:
  run:
    working-directory: apps/api

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: "pip" }
      - run: pip install -r requirements-dev.txt
      # E9/F = syntax errors + pyflakes (unused imports, undefined names) —
      # the ruleset actually run against this codebase; expand once the team
      # agrees on a style (E/W/I) rather than adding rules unverified.
      - run: ruff check app --select E9,F

  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: "pip" }
      - run: pip install -r requirements-dev.txt
      - run: pytest -v
        env:
          ENVIRONMENT: testing
          SECRET_KEY: ci-test-secret-key
          ANTHROPIC_API_KEY: sk-test-not-real
          OPENAI_API_KEY: sk-test-not-real
          REDIS_URL: redis://localhost:6379/0

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: "pip" }
      - run: pip install pip-audit
      # Non-blocking by default (transitive CVEs with no fix yet shouldn't
      # block every PR) — flip to failing once the team has a process for
      # triaging findings rather than being surprised by a red build.
      - run: pip-audit -r requirements.txt || echo "::warning::pip-audit found issues — review before merging"

  docker-build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: false
          tags: job-tracker-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
